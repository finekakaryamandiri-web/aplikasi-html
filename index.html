<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PT Aggam Jaya Group - Technical & Cost Engineering System</title>
<style>
:root {
  --primary-blue: #0b579d;
  --header-dark: #1e293b;
  --sidebar-dark: #0f172a;
  --bg-light: #f1f5f9;
  --panel-bg: #ffffff;
  --accent-green: #15803d;
  --text-dark: #0f172a;
  --border-color: #cbd5e1;
  --cad-blue: #0b579d;
  --cad-header: #1e293b;
  --cad-bg: #e2e8f0;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: var(--bg-light);
  color: var(--text-dark);
  overflow: hidden;
}

/* HEADER UTAMA */
header {
  height: 60px;
  background: var(--header-dark);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  border-bottom: 4px solid var(--primary-blue);
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  z-index: 100;
  position: relative;
}
